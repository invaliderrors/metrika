name: metrika

# ROADMAP 0.10's six services all live here now: `temporal` and `temporal-ui`
# were deferred until Plan 0B-3, where they are first used and their health
# checks could be verified against a real client rather than guessed. They are
# no longer deferred — see the `temporal` service below for what that
# verification actually found.
#
# Every published port below binds to 127.0.0.1 only, not 0.0.0.0: Docker's
# publish path inserts iptables/pf rules that bypass the macOS application
# firewall, so an unqualified `host:container` mapping exposes Postgres,
# MinIO and Mailpit's UI to the whole LAN. Do not "simplify" this back.
services:
  postgres:
    # KEEP IN SYNC with POSTGRES_IMAGE in packages/testing/src/images.ts.
    # packages/database/test/postgres-image.test.ts fails if these diverge.
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: metrika
      POSTGRES_PASSWORD: metrika
      POSTGRES_DB: metrika_dev
    ports:
      # EVERY published host port in this file is `${*_HOST_PORT:-<default>}`,
      # and every default is the number the documentation, the `.env.example`
      # URLs and docs/LOCAL_DEVELOPMENT.md's table already name. Nothing changes
      # for a machine that has those ports free.
      #
      # The overrides exist because a host port is shared with the whole
      # machine, not just with this project. A native Postgres service on 5432,
      # or a second project's compose stack, and this one cannot start at all:
      # Docker reports `bind: An attempt was made to access a socket in a way
      # forbidden by its access permissions` (or `address already in use`),
      # which names neither the port's owner nor which service of yours wanted
      # it. All of them rather than only the ones that have collided so far,
      # because "why does only Postgres have a knob" is a worse question than
      # eight symmetric lines.
      #
      # Two things do NOT follow automatically, and both are in `.env`: the host
      # half of DATABASE_URL / DATABASE_ADMIN_URL / REDIS_URL / S3_ENDPOINT /
      # SMTP_URL, and the ports the two apps listen on (API_PORT, WEB_PORT).
      # Change a knob here and change its URL there in the same edit.
      #
      # CONTAINER ports never move. `temporal` reaches Postgres by
      # POSTGRES_SEEDS + DB_PORT on the compose network, and every other
      # in-network consumer likewise, so none of this is visible to them.
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # One source of truth for the metrika_app role: the same file
      # packages/testing's withDatabase() (Task 6) applies to the
      # Testcontainers instance. Mounted by filename, not by directory,
      # because the harness copies named files rather than the whole
      # directory — mounting the directory here would let a future
      # packages/database/sql/01-*.sql apply locally while being silently
      # skipped in tests, the exact divergence this file's own header says
      # is eliminated. Adding a script means adding it in both places.
      # Runs once, at first initialisation of an empty data volume —
      # `pnpm infra:reset` is what re-runs it.
      - ../../packages/database/sql/00-app-role.sql:/docker-entrypoint-initdb.d/00-app-role.sql:ro
    healthcheck:
      # -h 127.0.0.1 is load-bearing, not decorative: with no -h, pg_isready
      # checks the unix socket at /var/run/postgresql, where the entrypoint's
      # TEMPORARY server (listen_addresses='') answers while
      # docker-entrypoint-initdb.d is still running. That reports healthy
      # before Postgres accepts TCP connections, which is exactly the race
      # --wait exists to remove. -U/-d are decorative — pg_isready accepts a
      # nonexistent role/db and still reports ready — kept for readability.
      # See Task 4 review round 1, Finding 1.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U metrika -d metrika_dev']
      interval: 2s
      timeout: 3s
      retries: 30
      # Real budget ~2s x 30 = 60s (interval x retries; each pg_isready call
      # is effectively instant). No start_period: init here is a single small
      # role-bootstrap script, so paying the health-check cost from t=0 is
      # cheaper than a fixed grace period. Revisit if init grows slow enough
      # that the 60s budget gets tight (see MinIO's real budget below).

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      # Host-port override; see the `postgres` block above. REDIS_URL in `.env`
      # must name the same number.
      - '127.0.0.1:${REDIS_HOST_PORT:-6379}:6379'
    healthcheck:
      # Real budget ~= 2s x 30 = 60s: redis-cli ping is effectively instant,
      # so interval x retries is not an underestimate here (contrast MinIO
      # below). No start_period: redis has no init to wait out.
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: metrika
      MINIO_ROOT_PASSWORD: metrika-local
    ports:
      # Host-port overrides; see the `postgres` block above. S3_ENDPOINT in
      # `.env` must name MINIO_HOST_PORT. The console port is the one
      # docs/LOCAL_DEVELOPMENT.md links; `--console-address :9001` in `command`
      # is the CONTAINER side and does not move with it.
      - '127.0.0.1:${MINIO_HOST_PORT:-9000}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      # Real budget is NOT interval x retries = 90s: measured ~4 minutes.
      # `mc ready local` costs ~4s per failing call, on top of the interval,
      # while MinIO is still coming up — the real budget is
      # retries x (interval + check duration), which is why this is more
      # patient than it looks. No start_period, for the same reason as
      # postgres: nothing here is slow enough yet to justify one.
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 3s
      timeout: 5s
      retries: 30

  temporal:
    # KEEP IN SYNC with TEMPORAL_IMAGE in packages/testing/src/images.ts.
    # packages/database/test/postgres-image.test.ts fails if these diverge.
    #
    # Pinned by ADR-0027, and NOT `:latest` — which here is not a stylistic
    # point. MEASURED 2026-08-10: `temporalio/auto-setup:latest` resolves to
    # 1.29.3, four patch releases BEHIND this tag. A compose file naming
    # "latest" would pin OLDER than one naming a version, with the word
    # "latest" on screen saying otherwise.
    #
    # `auto-setup` is a local-development image specifically: it provisions the
    # `default` namespace and the search attributes on first boot. Production is
    # Temporal Cloud (ADR-0006) and has no counterpart to this service.
    image: temporalio/auto-setup:1.29.7
    depends_on:
      postgres:
        # Not cosmetic: auto-setup runs the schema tool against Postgres before
        # it starts the server, and `service_started` would race the database's
        # own init.
        condition: service_healthy
    environment:
      DB: postgres12
      # SIX variables. ADR-0027 says five and says it as a complete count;
      # ADR-0028 corrects that with BIND_ON_IP below. Both are needed to read
      # this block.
      #
      # DB_PORT is the one that is easy to omit.
      # It defaults to 3306 — MySQL's port — and omitting it does not fail
      # loudly: auto-setup.sh loops `until nc -z "${POSTGRES_SEEDS}" 3306`, so
      # the container sits `Up` logging "Waiting for PostgreSQL" forever while
      # `docker ps` shows a healthy-looking container and `docker compose up -d`
      # returns 0. The first symptom is a worker connection timeout with nothing
      # obviously broken upstream. See ADR-0027, "The Temporal image tag".
      DB_PORT: '5432'
      # The compose network alias of the postgres service above, not localhost:
      # this resolves inside the temporal container.
      POSTGRES_SEEDS: postgres
      # The OWNER role, not metrika_app: auto-setup CREATEs the `temporal` and
      # `temporal_visibility` databases in this instance and owns their schema.
      # metrika_app is NOSUPERUSER NOBYPASSRLS and deliberately cannot.
      POSTGRES_USER: metrika
      POSTGRES_PWD: metrika
      # The sixth, added by ADR-0028, and it is what makes the healthcheck
      # below addressable at all.
      #
      # `/etc/temporal/entrypoint.sh:5` in this image:
      #   : "${BIND_ON_IP:=$(getent hosts "$(hostname)" | awk '{print $1;}')}"
      # — the container's FIRST address — which dockerize then threads into
      # five `bindOnIP` fields in config_template.yaml (frontend, matching,
      # history, worker, internal-frontend). So temporal-server binds exactly
      # one interface, neither `0.0.0.0` nor loopback, and MEASURED with this
      # left out, `netstat -ltn` inside the container shows a single
      # `172.x.y.z:7233` while a `127.0.0.1` probe fails forever against a
      # server that is serving normally.
      #
      # `:=` expands on unset OR NULL, so `BIND_ON_IP: ''` reproduces the
      # default path exactly — that, not deleting the line, is the mutation to
      # use when re-testing this.
      #
      # It bites harder in `packages/testing`'s harness than here, which is why
      # both carry the variable rather than only the one that needed it:
      # testcontainers attaches an ALIASED container to the default bridge as
      # well as its own network, "first address" is then the bridge one, and
      # the server ends up listening on an interface its own network alias does
      # not resolve to. Measured there as 45s of `connection refused` against
      # `temporal:7233` while the server was up on a different subnet.
      #
      # `entrypoint.sh` special-cases `0.0.0.0` and sets
      # TEMPORAL_BROADCAST_ADDRESS from the same `getent`, so ring membership
      # keeps a real address and the single-node cluster still forms. Nothing
      # new is published to the host: `ports` below is still the only thing
      # crossing the container boundary, and still only on loopback.
      BIND_ON_IP: '0.0.0.0'
    ports:
      # Host-port override; see the `postgres` block above. This is what a
      # worker or a client dials from the host. The healthcheck below stays on
      # `127.0.0.1:7233` deliberately — it runs INSIDE the container, where the
      # port never moves.
      - '127.0.0.1:${TEMPORAL_HOST_PORT:-7233}:7233'
    healthcheck:
      # `namespace describe default`, not `nc -z 127.0.0.1 7233`, for the same
      # reason postgres above passes `-h 127.0.0.1`: the weaker check reports
      # healthy before the service is usable. MEASURED inside this container on
      # a cold start — inside is the only place that matters, because a docker
      # healthcheck executes IN the container:
      #
      #   t=0.74s  nc -z 127.0.0.1 7233                  SUCCEEDS
      #   t=1.79s  temporal operator namespace describe  SUCCEEDS
      #
      # auto-setup binds the port, THEN creates two databases, applies both
      # schemas and registers `default` last. A client that connects in that
      # ~1s window fails its first real call with
      # `Namespace default is not found` — which is what this command returns
      # across exactly the same window.
      #
      # Swapping this line for `nc -z` and re-running end to end, with the
      # start_interval below in place: compose reported healthy at **1.20s**
      # and a `namespace describe` run immediately afterwards **failed** with
      # `Namespace default is not found`. With this command: healthy at
      # **2.72s**, and the same call succeeded. That is the whole difference,
      # and it is worth ~1.5 seconds.
      #
      # (Do NOT justify this with a host-side dial. `127.0.0.1:7233` on the
      # HOST accepts a connection the instant `docker compose up -d` returns,
      # with zero sockets listening inside the container, because docker-proxy
      # binds the published port at creation. True, and irrelevant here — a
      # healthcheck never runs on the host. It is a real argument for
      # `packages/testing`'s harness, which dials from the host, and it is
      # recorded there.)
      test:
        [
          'CMD',
          'temporal',
          'operator',
          'namespace',
          'describe',
          '--namespace',
          'default',
          '--address',
          '127.0.0.1:7233',
        ]
      interval: 3s
      timeout: 5s
      retries: 40
      # start_period + start_interval are what make the choice above
      # OBSERVABLE, and they were added because without them the mutation that
      # justifies it cannot fail. At `interval: 3s` alone — the shape every
      # other service here uses — docker's first probe fires after the ~1s
      # window has already closed, so `nc -z` and this command are
      # indistinguishable and the weaker one looks fine. The 1.20s-vs-2.72s
      # result quoted above is only visible because docker polls at 100ms
      # during the start period.
      #
      # start_period only stops failures counting toward `retries`; it does not
      # delay the first probe, so this is strictly faster to healthy as well.
      # 90s covers a cold boot — postgres waited on, two databases created, two
      # schemas applied — after which the 3s x 40 budget (~2 minutes) governs a
      # server that has already been up once.
      start_period: 90s
      start_interval: 100ms

  temporal-ui:
    image: temporalio/ui:2.53.2
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      # The UI is a browser client of its own server, and the browser's origin
      # is the PUBLISHED port (8233), not the container's (8080). Without this
      # every API call from the page is blocked by CORS.
      TEMPORAL_CORS_ORIGINS: http://localhost:${TEMPORAL_UI_HOST_PORT:-8233}
    ports:
      # 8233 on the host by default, matching what `temporal server start-dev`
      # publishes, so the URL in docs/LOCAL_DEVELOPMENT.md is the one people
      # already know. Host-port override; see the `postgres` block above — and
      # note TEMPORAL_CORS_ORIGINS just above must name the same number, since
      # it is the browser origin this UI is reached at.
      - '127.0.0.1:${TEMPORAL_UI_HOST_PORT:-8233}:8080'
    healthcheck:
      # The image is busybox-based and has wget but no curl. `-q -O -` because
      # busybox wget writes to ./index.html otherwise, in a read-only-ish
      # container, and a healthcheck that fails on disk rather than on the
      # service is worse than none.
      test: ['CMD', 'wget', '--quiet', '--output-document=-', 'http://127.0.0.1:8080/health']
      interval: 3s
      timeout: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.30.7
    ports:
      # Host-port overrides; see the `postgres` block above. SMTP_URL in `.env`
      # must name MAILPIT_SMTP_HOST_PORT; the UI port is what
      # docs/LOCAL_DEVELOPMENT.md links.
      - '127.0.0.1:${MAILPIT_SMTP_HOST_PORT:-1025}:1025'
      - '127.0.0.1:${MAILPIT_UI_HOST_PORT:-8025}:8025'
    healthcheck:
      # Real budget ~= 3s x 30 = 90s: readyz is effectively instant once the
      # process is up. No start_period: mailpit has no init to wait out.
      test: ['CMD', '/mailpit', 'readyz']
      interval: 3s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
  minio-data:
