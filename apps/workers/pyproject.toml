[project]
name = "metrika-workers"
version = "0.0.0"
# Exact-major, not `>=3.12`. ADR-0027 measured every direct and transitive
# dependency against this interpreter; `numpy@2.5.2` (via `trimesh`) already
# forecloses 3.11 downward, and `trimesh@5.0.0` would install on 3.14 with no
# warning at all despite classifying only up to 3.13. The patch is pinned in
# `.python-version`, which is the file both `uv` and `pyenv` read.
requires-python = "==3.12.*"
dependencies = []

[tool.uv.workspace]
# `geometry` and `slicer` (the two worker processes) and `packages/*` (their
# shared libraries) are added by later tasks in Plan 0B-3. A member pattern
# matching nothing is not an error, so the list is written once, here, rather
# than grown by whichever task happens to add a directory first.
members = ["packages/*", "geometry", "slicer"]

[tool.ruff]
target-version = "py312"
# 100 to match Prettier's `printWidth` — one wrap width for the repository
# rather than one per language.
#
# READ BEFORE CHANGING ANY KEY IN THIS SECTION, `line-length` above all.
# This configuration is an INPUT TO GENERATED CODE. `contracts:emit` runs
# `datamodel-codegen --formatters ruff-format ruff-check`, so the committed
# pydantic models under `src/**/generated/` are a function of this file, of the
# pinned `ruff`, and of `--target-python-version` — not of the JSON Schema
# alone. ADR-0027 measured it: adding a `line-length` reflowed the output from
#
#     amountMinor: Annotated[str, Field(pattern="^(0|-?[1-9][0-9]*)$")]
#
# to a three-line form. CI diffs those generated files against the committed
# copy, so an edit here turns that gate red in files this commit never touched,
# on a pull request about something else. Regenerate and commit the models in
# the SAME commit as any change below (ADR-0027 obligation 6). A diff gate that
# goes red for reasons unrelated to its subject is a gate that gets disabled.
line-length = 100

[tool.ruff.lint]
# Deliberately broad. The Node side runs typescript-eslint's strict and
# stylistic sets plus type-aware rules; an equivalently strict Python side is
# what ADR-0007 promised when it accepted a second toolchain.
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "ARG", "PTH", "RUF", "ASYNC", "S"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# assert is the point of a test file; S101 bans it everywhere else.
#
# S607 (partial executable path) is relaxed for tests ONLY. `S` exists here to
# keep a worker from shelling out to whatever `PATH` happens to resolve; a test
# that asserts `uv run ruff check` is clean has to invoke the developer's `uv`
# through `PATH`, because reproducing what a developer runs IS the assertion.
# Hard-coding an absolute interpreter path would make the test pass on one
# machine. Every other `S` rule, S603 included, still applies to test files.
"tests/**" = ["S101", "S607"]

[tool.mypy]
strict = true
python_version = "3.12"
warn_unreachable = true
# The Python half of "no `any`, no exceptions". `strict` alone still permits a
# hand-written `Any` annotation, which is the same escape hatch `@ts-ignore` is
# on the other side and is banned for the same reason.
disallow_any_explicit = true

[dependency-groups]
# Exact `==` pins, every one from ADR-0027's measured table. `uv add` writes
# `>=` ranges instead, so these were written by hand — and `uv.lock` is
# committed, and CI installs with `--frozen`, because a bare `uv sync`
# re-resolves and turns every pin here into a decoration.
#
# `boto3-stubs[s3]` is NOT a convenience. `boto3` and `botocore` are the only
# packages in this toolchain that ship no `py.typed` marker; without the stubs
# `mypy --strict` reports `import-untyped` and the whole S3 surface degrades to
# unchecked `Any` — in the one module the workers use to reach storage.
# ADR-0027 obligation 3.
dev = [
  "ruff==0.16.2",
  "mypy==2.3.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "boto3-stubs[s3]==1.43.67",
]
