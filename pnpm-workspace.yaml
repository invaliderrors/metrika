packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 11 gates dependency build scripts behind explicit consent. Without these
# entries a from-scratch `pnpm install` exits 1 with ERR_PNPM_IGNORED_BUILDS,
# which fails `pnpm verify` and CI. (On pnpm 10 the key is
# `onlyBuiltDependencies`; 11.20.0 reads `allowBuilds`.)
allowBuilds:
  prisma: true
  '@prisma/client': true
  '@prisma/engines': true
  # Transitive dependencies of testcontainers (packages/testing): ssh2 is used
  # for its optional Docker-over-SSH support, cpu-features is ssh2's own
  # native-binding dependency, and protobufjs is pulled in by dockerode's gRPC
  # plumbing. None of the three are used by anything else in this repository.
  cpu-features: true
  protobufjs: true
  ssh2: true
  # DENIED, deliberately. Reached via swagger-ui-dist → @nestjs/swagger
  # (ADR-0019). Its install script is analytics: it posts package, version and
  # platform to scarf.sh on every install, including CI. Nothing in this repo
  # serves swagger-ui — the OpenAPI document is emitted to a file — so the
  # package is inert either way and the only thing its build script would do is
  # phone home. `false` rather than deletion: an absent entry is what
  # ERR_PNPM_IGNORED_BUILDS complains about, and would leave the next person to
  # re-decide this from scratch.
  '@scarf/scarf': false
  # DENIED. Reached via eslint-import-resolver-typescript@3.10.1 →
  # eslint-config-next@16.3.0 (ADR-0021), and again through
  # eslint-module-utils → eslint-plugin-import → the same resolver.
  # Its build script downloads/links a prebuilt native resolver binary. ADR-0021's
  # spike measured the denial safe: with the script denied, `pnpm install`,
  # `next build`, `next dev` and a hand-enabled `import/no-unresolved` all work,
  # because the package falls back to its WASM/JS path. `false` rather than
  # deletion, for the reason recorded above @scarf/scarf: an absent entry is what
  # ERR_PNPM_IGNORED_BUILDS fails on. ADR-0021 obligation 4 names two more —
  # `@parcel/watcher` and `@swc/core` — which arrive with `next` itself and so
  # belong to the task that installs it, not this one.
  unrs-resolver: false
  # DENIED. Both arrive with `next@16.3.0` (ADR-0021), which is what makes them
  # this task's entries rather than the previous one's: @parcel/watcher is
  # Next's optional filesystem-watcher backend for `next dev`, and @swc/core is
  # reached through Next's own toolchain. Neither is imported by anything in
  # this repository directly. ADR-0021 obligation 4 measured the denial safe on
  # both — with every build script denied, `pnpm install`, `next build` and
  # `next dev` all work, because each falls back to a prebuilt or JS path.
  # `false` rather than deletion, for the reason recorded above @scarf/scarf: an
  # absent entry is what ERR_PNPM_IGNORED_BUILDS fails on.
  '@parcel/watcher': false
  '@swc/core': false
  # DENIED. Reached via @sentry/nextjs@10.70.0 → @sentry/bundler-plugin-core →
  # @sentry/cli, whose install script downloads a prebuilt `sentry-cli` binary.
  # ADR-0029 obligation 12 measured both halves of this entry: WITHOUT it a
  # from-scratch `pnpm install` exits 1 with
  # `ERR_PNPM_IGNORED_BUILDS: @sentry/cli@2.58.6` for the WHOLE repository, not
  # just apps/web — reproduced here before the line was added — and WITH the
  # denial `pnpm install` exits 0 and `next build` exits 0 with
  # `withSentryConfig` applied. The binary exists to create releases and upload
  # source maps; `next.config.ts` disables both (`sourcemaps.disable`,
  # `telemetry: false`), so nothing in this repository invokes it.
  #
  # `false` rather than deletion, for the reason recorded above @scarf/scarf: an
  # absent entry is what ERR_PNPM_IGNORED_BUILDS fails on, so removing this line
  # re-breaks every install rather than restoring a default.
  '@sentry/cli': false
