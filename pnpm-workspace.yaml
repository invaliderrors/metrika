packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 11 gates dependency build scripts behind explicit consent. Without these
# entries a from-scratch `pnpm install` exits 1 with ERR_PNPM_IGNORED_BUILDS,
# which fails `pnpm verify` and CI. (On pnpm 10 the key is
# `onlyBuiltDependencies`; 11.20.0 reads `allowBuilds`.)
allowBuilds:
  prisma: true
  '@prisma/client': true
  '@prisma/engines': true
  # Transitive dependencies of testcontainers (packages/testing): ssh2 is used
  # for its optional Docker-over-SSH support, cpu-features is ssh2's own
  # native-binding dependency, and protobufjs is pulled in by dockerode's gRPC
  # plumbing. None of the three are used by anything else in this repository.
  cpu-features: true
  protobufjs: true
  ssh2: true
