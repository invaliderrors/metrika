name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint -- --max-warnings=0

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      # NOTE: this step runs after "Unit tests", and packages/contracts' test:unit
      # (vitest run --coverage) writes an istanbul/v8 HTML coverage report to
      # packages/contracts/coverage/*.js. Those generated support files (sorter.js,
      # block-navigation.js, prettify.js) start with an unjustified `/* eslint-disable */`.
      # Left unexcluded, this step fails on every run, including a clean tree — the
      # --exclude-dir flags below are load-bearing, not decoration. dist/ and
      # node_modules/ are excluded for the same reason (generated/vendored code, not
      # something this check should be reviewing) even though nothing in them currently
      # trips it.
      - name: Reject unjustified suppressions
        run: |
          if grep -rnE '(eslint-disable[^\n]*|@ts-expect-error)' \
               --include='*.ts' --include='*.tsx' --include='*.js' \
               --exclude-dir=node_modules --exclude-dir=coverage --exclude-dir=dist \
               packages apps 2>/dev/null | grep -v -- '--'; then
            echo "::error::Every eslint-disable / @ts-expect-error needs a '-- <justification>'"
            exit 1
          fi

      # NOTE: this must not be a bare `if grep ...; then` — with `apps/` not existing yet,
      # grep's own exit code is not a reliable signal of "no match" (a path-open error can
      # take precedence over a real match found elsewhere in the same invocation, which
      # makes the `if` false and silently passes a real @ts-ignore). Piping through
      # `grep -q .` makes the `if` depend on whether any content survived — i.e. on the
      # match itself — not on grep's own exit status. Same reasoning as the step above.
      - name: Reject @ts-ignore
        run: |
          if grep -rn '@ts-ignore' --include='*.ts' --include='*.tsx' \
               --exclude-dir=node_modules --exclude-dir=coverage --exclude-dir=dist \
               packages apps 2>/dev/null | grep -q .; then
            echo "::error::@ts-ignore is banned — use @ts-expect-error with a justification"
            exit 1
          fi
