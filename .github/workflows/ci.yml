name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint -- --max-warnings=0

      # `typecheck` is `tsc -b --force` in every package, and the `--force` is
      # load-bearing. No tsconfig in this repo declares project `references`, so a
      # workspace dependency's emitted `.d.ts` is not among a consumer project's own
      # input file names — which means `tsc -b`'s up-to-date check cannot see it change,
      # and the consumer is skipped as up to date against a stale build-info.
      # MEASURED: with a type-only widening in packages/contracts, `pnpm verify` reported
      # every task successful while `tsc -b --force` failed with TS2741.
      #
      # Two things keep that from biting CI today, and BOTH are load-bearing:
      #
      #   1. the `--force` above, and
      #   2. the fact that nothing here caches `.turbo` or any `*.tsbuildinfo`.
      #
      # A `.turbo` cache step is the obvious speed-up for this workflow. DO NOT ADD ONE
      # without first landing project `references` (the real fix): restoring build-info
      # into a fresh checkout is what turns this job from "catches a cross-package type
      # break" into "silently reports it green". Turbo's `outputs` is not a substitute —
      # MEASURED, turbo does not clean declared outputs before a cache-miss run, so a
      # stale `*.tsbuildinfo` survives and `tsc -b` skips exactly as before.
      #
      # `--force` does NOT reach the `build` task, which skips for the same reason:
      # MEASURED, `pnpm build` exits 0 on a tree that does not compile and never
      # touches apps/api/dist. Turbo is not what saves us there — it ran the task as a
      # cache MISS and `tsc -b` itself decided there was nothing to do. What keeps that
      # harmless today is narrower and will not hold forever: apps/api's emitted JS
      # inlines nothing from contracts, and no package re-exports a workspace
      # dependency's types in its own `.d.ts`. The day packages/database re-exports a
      # contracts type — it already declares the dependency — apps/api's
      # `typecheck --force` will be checking against a stale
      # packages/database/dist/*.d.ts, which is this whole problem reopening one level
      # upstream, where `--force` cannot see it.
      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      # NOTE: this step runs after "Unit tests", and packages/contracts' test:unit
      # (vitest run --coverage) writes an istanbul/v8 HTML coverage report to
      # packages/contracts/coverage/*.js. Those generated support files (sorter.js,
      # block-navigation.js, prettify.js) start with an unjustified `/* eslint-disable */`.
      # Left unexcluded, this step fails on every run, including a clean tree — the
      # --exclude-dir flags below are load-bearing, not decoration. dist/ and
      # node_modules/ are excluded for the same reason (generated/vendored code, not
      # something this check should be reviewing) even though nothing in them currently
      # trips it.
      - name: Reject unjustified suppressions
        run: |
          if grep -rnE '(eslint-disable[^\n]*|@ts-expect-error)' \
               --include='*.ts' --include='*.tsx' --include='*.js' \
               --exclude-dir=node_modules --exclude-dir=coverage --exclude-dir=dist \
               packages apps 2>/dev/null | grep -v -- '--'; then
            echo "::error::Every eslint-disable / @ts-expect-error needs a '-- <justification>'"
            exit 1
          fi

      # NOTE: this must not be a bare `if grep ...; then` — with `apps/` not existing yet,
      # grep's own exit code is not a reliable signal of "no match" (a path-open error can
      # take precedence over a real match found elsewhere in the same invocation, which
      # makes the `if` false and silently passes a real @ts-ignore). Piping through
      # `grep -q .` makes the `if` depend on whether any content survived — i.e. on the
      # match itself — not on grep's own exit status. Same reasoning as the step above.
      - name: Reject @ts-ignore
        run: |
          if grep -rn '@ts-ignore' --include='*.ts' --include='*.tsx' \
               --exclude-dir=node_modules --exclude-dir=coverage --exclude-dir=dist \
               packages apps 2>/dev/null | grep -q .; then
            echo "::error::@ts-ignore is banned — use @ts-expect-error with a justification"
            exit 1
          fi
