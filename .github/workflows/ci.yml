name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# READ THIS BEFORE ADDING A CACHE STEP TO ANY JOB IN THIS FILE.
#
# Do not add `actions/cache` for `.turbo`, and do not enable a Turbo remote
# cache, without first landing project `references` in the tsconfigs. Every job
# below runs `pnpm build`, and `tsc -b`'s up-to-date check is only trustworthy
# here because a fresh checkout carries no `*.tsbuildinfo`. The full reasoning,
# with the measurements behind it, is on the `Typecheck` step of the `verify`
# job. It applies to `integration` and `openapi` identically: both build the
# workspace, and both would start believing a stale build-info the moment one
# is restored.

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # packages/database's `build` runs `prisma generate`, which resolves
      # schema.prisma's `env("DATABASE_ADMIN_URL")`. CI has no `.env` — that is
      # what `--env-file-if-exists` in the root db:* scripts is for — so the
      # value comes from here. Nothing connects to it; `prisma generate` reads
      # the URL only to validate the datasource block.
      DATABASE_ADMIN_URL: postgresql://metrika:metrika@127.0.0.1:5432/metrika_ci?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      # Mirrors `pnpm verify`, which builds before it lints: `lint` and
      # `typecheck` both declare `dependsOn: ["^build", "db:generate"]`, so a
      # workspace dependency that does not compile has to surface as a failed
      # build rather than as a confusing type error in its consumer.
      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint -- --max-warnings=0

      # `typecheck` is `tsc -b --force` in every package, and the `--force` is
      # load-bearing. No tsconfig in this repo declares project `references`, so a
      # workspace dependency's emitted `.d.ts` is not among a consumer project's own
      # input file names — which means `tsc -b`'s up-to-date check cannot see it change,
      # and the consumer is skipped as up to date against a stale build-info.
      # MEASURED: with a type-only widening in packages/contracts, `pnpm verify` reported
      # every task successful while `tsc -b --force` failed with TS2741.
      #
      # Two things keep that from biting CI today, and BOTH are load-bearing:
      #
      #   1. the `--force` above, and
      #   2. the fact that nothing here caches `.turbo` or any `*.tsbuildinfo`.
      #
      # A `.turbo` cache step is the obvious speed-up for this workflow. DO NOT ADD ONE
      # without first landing project `references` (the real fix): restoring build-info
      # into a fresh checkout is what turns this job from "catches a cross-package type
      # break" into "silently reports it green". Turbo's `outputs` is not a substitute —
      # MEASURED, turbo does not clean declared outputs before a cache-miss run, so a
      # stale `*.tsbuildinfo` survives and `tsc -b` skips exactly as before.
      #
      # `--force` does NOT reach the `build` task, which skips for the same reason:
      # MEASURED, `pnpm build` exits 0 on a tree that does not compile and never
      # touches apps/api/dist. Turbo is not what saves us there — it ran the task as a
      # cache MISS and `tsc -b` itself decided there was nothing to do. What keeps that
      # harmless today is narrower and will not hold forever: apps/api's emitted JS
      # inlines nothing from contracts, and no package re-exports a workspace
      # dependency's types in its own `.d.ts`. The day packages/database re-exports a
      # contracts type — it already declares the dependency — apps/api's
      # `typecheck --force` will be checking against a stale
      # packages/database/dist/*.d.ts, which is this whole problem reopening one level
      # upstream, where `--force` cannot see it.
      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      # NOTE: this step runs after "Unit tests", and packages/contracts' test:unit
      # (vitest run --coverage) writes an istanbul/v8 HTML coverage report to
      # packages/contracts/coverage/*.js. Those generated support files (sorter.js,
      # block-navigation.js, prettify.js) start with an unjustified `/* eslint-disable */`.
      # Left unexcluded, this step fails on every run, including a clean tree — the
      # --exclude-dir flags below are load-bearing, not decoration. dist/ and
      # node_modules/ are excluded for the same reason (generated/vendored code, not
      # something this check should be reviewing) even though nothing in them currently
      # trips it.
      - name: Reject unjustified suppressions
        run: |
          if grep -rnE '(eslint-disable[^\n]*|@ts-expect-error)' \
               --include='*.ts' --include='*.tsx' --include='*.js' \
               --exclude-dir=node_modules --exclude-dir=coverage --exclude-dir=dist \
               packages apps 2>/dev/null | grep -v -- '--'; then
            echo "::error::Every eslint-disable / @ts-expect-error needs a '-- <justification>'"
            exit 1
          fi

      # NOTE: this must not be a bare `if grep ...; then` — with `apps/` not existing yet,
      # grep's own exit code is not a reliable signal of "no match" (a path-open error can
      # take precedence over a real match found elsewhere in the same invocation, which
      # makes the `if` false and silently passes a real @ts-ignore). Piping through
      # `grep -q .` makes the `if` depend on whether any content survived — i.e. on the
      # match itself — not on grep's own exit status. Same reasoning as the step above.
      - name: Reject @ts-ignore
        run: |
          if grep -rn '@ts-ignore' --include='*.ts' --include='*.tsx' \
               --exclude-dir=node_modules --exclude-dir=coverage --exclude-dir=dist \
               packages apps 2>/dev/null | grep -q .; then
            echo "::error::@ts-ignore is banned — use @ts-expect-error with a justification"
            exit 1
          fi

  # A separate job, not a step in `verify`, because everything it proves is
  # invisible to `verify`'s gates. `import type` on an injected provider, a
  # `Module.forRoot()` in AppModule, an RLS policy that does not isolate a
  # tenant, a probe that answers 200 while its dependency is down, a stack
  # trace escaping the exception filter: `format:check`, `lint`, `typecheck`
  # and `test:unit` are all green for every one of them.
  integration:
    runs-on: ubuntu-latest
    env:
      # packages/database's `build` runs `prisma generate`, which resolves
      # schema.prisma's `env("DATABASE_ADMIN_URL")`. CI has no `.env` — that is
      # what `--env-file-if-exists` in the root db:* scripts is for — so the
      # value comes from here. Nothing connects to it; the Testcontainers
      # harness passes the real, container-derived URL explicitly.
      DATABASE_ADMIN_URL: postgresql://metrika:metrika@127.0.0.1:5432/metrika_ci?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # See the cache warning at the top of this file before adding `.turbo`
      # caching to speed this up.
      - name: Build
        run: pnpm build

      # No `docker compose up` here: Testcontainers starts its own Postgres per
      # run, which is the point of it — the suite must not depend on a stack a
      # workflow file happened to bring up. ubuntu-latest ships a running
      # Docker daemon, so packages/testing's preflight passes.
      - name: Integration tests
        run: pnpm test:integration

  openapi:
    runs-on: ubuntu-latest
    env:
      DATABASE_ADMIN_URL: postgresql://metrika:metrika@127.0.0.1:5432/metrika_ci?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # See the cache warning at the top of this file before adding `.turbo`
      # caching to speed this up. `openapi:emit` runs `dist/scripts/
      # emit-openapi.js`, so this step is what produces the thing the next two
      # steps read — it is not an optimisation.
      - name: Build
        run: pnpm build

      # There is no `services: postgres:` block and no Testcontainer here, on
      # purpose. `emit-openapi.ts` does not call `app.init()`, so no lifecycle
      # hook fires and `PrismaService.$connect()` is never reached — emitting a
      # document is a static operation on the module graph. DATABASE_URL still
      # has to be present and well-formed, because ConfigModule validates the
      # environment while the graph is built; it does not have to be reachable.
      # The values are supplied here rather than through a `.env` file because
      # `openapi:emit` deliberately carries no `--env-file`.
      - name: Regenerate the OpenAPI document
        env:
          DATABASE_URL: postgresql://metrika_app:metrika_app@127.0.0.1:5432/metrika_dev?schema=public
          HEALTH_DEEP_TOKEN: ci-health-deep-token-value
        run: pnpm --filter @metrika/api openapi:emit

      # The document is committed, so a route or schema change that nobody
      # regenerated shows up as a diff here rather than as a client that no
      # longer matches the server.
      - name: Fail if the committed document is stale
        run: git diff --exit-code -- apps/api/openapi/openapi.json
