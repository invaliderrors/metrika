name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# READ THIS BEFORE ADDING A CACHE STEP TO ANY JOB IN THIS FILE.
#
# Do not add `actions/cache` for `.turbo`, and do not enable a Turbo remote
# cache, without first landing project `references` in the tsconfigs. Every job
# below runs `pnpm build`, and `tsc -b`'s up-to-date check is only trustworthy
# here because a fresh checkout carries no `*.tsbuildinfo`. The full reasoning,
# with the measurements behind it, is on the `Typecheck` step of the `verify`
# job. It applies to `integration` and `openapi` identically: both build the
# workspace, and both would start believing a stale build-info the moment one
# is restored.

# WORKFLOW-LEVEL, so that a job added later INHERITS these rather than
# rediscovering their absence as a build failure. Every one of them was
# per-job and identical across all three; that is a default nobody chose,
# and the next job to be added is where it bites.
#
# That is not hypothetical. Plan 0B-2 Task 8 adds a `web` job, and its draft set
# the two NEXT_PUBLIC_ keys on its E2E step only — which would have died one
# step earlier, at Build, with a ZodError about environment configuration in a
# job whose subject is Playwright. Hoisting is what makes that failure
# impossible rather than merely documented.
#
# A job that needs a DIFFERENT value overrides it with its own `env:` block;
# job-level wins over workflow-level. Nothing needs that today.
#
# Every measurement that used to live in the three per-job blocks is preserved
# below, consolidated rather than triplicated. Leaving three copies of a comment
# beside a variable none of them still sets would read as if they did.
env:
  # ── DATABASE_ADMIN_URL ────────────────────────────────────────────────────
  # packages/database's `build` runs `prisma generate`, and schema.prisma's
  # datasource is `env("DATABASE_ADMIN_URL")`. CI has no `.env` — that is what
  # `--env-file-if-exists` in the root db:* scripts is for — so if anything
  # resolves that variable, the value has to come from here.
  #
  # MEASURED on Prisma 6.19.3, from a clean clone with the variable unset:
  # `pnpm build` exits 0 and generates the client without complaint, so
  # `generate` does NOT resolve the datasource url. This is therefore not
  # load-bearing today. It is set anyway, because every other Prisma subcommand
  # (`migrate`, `validate`, `studio`) does resolve it, the failure mode when one
  # is added is an unhelpful `Environment variable not found:
  # DATABASE_ADMIN_URL`, and a URL nothing connects to costs nothing. Do not
  # read this as proof the build needs it.
  #
  # Nothing in the `integration` job connects to it either: the Testcontainers
  # harness runs `prisma migrate deploy` against the real, container-derived URL,
  # which it passes explicitly. The `openapi` job has no Postgres at all —
  # `emit-openapi.ts` never calls `app.init()`, so no lifecycle hook fires and
  # `PrismaService.$connect()` is never reached; the variables its own step sets
  # have to be present and well-formed, not reachable.
  DATABASE_ADMIN_URL: postgresql://metrika:metrika@127.0.0.1:5432/metrika_ci?schema=public

  # ── NEXT_PUBLIC_* ─────────────────────────────────────────────────────────
  # UNLIKE the variable above, these two ARE load-bearing.
  #
  # `apps/web/src/config/env.ts` parses `clientEnv` at module scope and
  # `src/app/layout.tsx` imports it, so `next build` resolves both keys while
  # collecting page data. MEASURED, with them unset: exit 1, "Failed to collect
  # page data for" whichever route a worker reaches first (`/` or `/_not-found`
  # — both import the layout, and page data is collected in parallel), with a
  # ZodError naming both keys. That is the intended behaviour — a
  # misconfigured deployment must fail at build rather than on a user's first
  # render — which makes supplying them here part of the contract rather than a
  # workaround.
  #
  # Every job here needs them, and not only through its own `pnpm build` step:
  # MEASURED, `turbo run test:unit` and `turbo run test:integration` each
  # schedule `@metrika/web#build`, because both declare
  # `dependsOn: ["^build", "build"]`.
  #
  # Supplied here rather than through a `.env` file because CI has none:
  # `pnpm build` is `node --env-file-if-exists=.env …`, the `-if-exists` half is
  # what makes a missing file fine, and a real environment variable wins over the
  # file anyway. So CI and a developer's `pnpm build` take the same path with
  # different sources.
  #
  # NOT SECRETS, and they never can be: `NEXT_PUBLIC_` values are compiled into
  # the JavaScript every visitor downloads. See the warning in `.env.example`
  # before adding a third key here.
  NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:3001
  NEXT_PUBLIC_DEFAULT_LOCALE: es-CO

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # `verify` is the only job that reaches apps/workers. Its four steps —
      # format:check, lint, typecheck, test:unit — all run through turbo, and
      # apps/workers defines every one of them as a `uv run …` shim. The other
      # three jobs run `build` and `test:integration`, which that package does
      # not define, so turbo skips it there and they need no uv.
      #
      # Pinned to the version in ADR-0027, like every other tool here. uv
      # provisions its own CPython from .python-version, so there is
      # deliberately no actions/setup-python step — a second interpreter
      # source is a second thing to drift.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: '0.12.3'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      # Mirrors `pnpm verify`, which builds before it lints: `lint` and
      # `typecheck` both declare `dependsOn: ["^build", "db:generate"]`, so a
      # workspace dependency that does not compile has to surface as a failed
      # build rather than as a confusing type error in its consumer.
      - name: Build
        run: pnpm build

      # Deliberately a bare `pnpm lint`. `--max-warnings=0` now lives in the root
      # `lint` script itself, so this job and a developer's `pnpm verify` run the
      # SAME command. It used to live only here, which made `pnpm verify`
      # systematically weaker than CI: every warning-severity rule was invisible
      # locally and red only in CI. That gap shipped twice — once in Plan 0B-2
      # Task 2, and again in Task 3 via `import/no-anonymous-default-export`,
      # which warns on an anonymous default export in a flat config. Do not
      # re-add the flag here: two places to change is how the two drift apart.
      - name: Lint
        run: pnpm lint

      # `typecheck` is `tsc -b --force` in every package, and the `--force` is
      # load-bearing. No tsconfig in this repo declares project `references`, so a
      # workspace dependency's emitted `.d.ts` is not among a consumer project's own
      # input file names — which means `tsc -b`'s up-to-date check cannot see it change,
      # and the consumer is skipped as up to date against a stale build-info.
      # MEASURED: with a type-only widening in packages/contracts, `pnpm verify` reported
      # every task successful while `tsc -b --force` failed with TS2741.
      #
      # Two things keep that from biting CI today, and BOTH are load-bearing:
      #
      #   1. the `--force` above, and
      #   2. the fact that nothing here caches `.turbo` or any `*.tsbuildinfo`.
      #
      # A `.turbo` cache step is the obvious speed-up for this workflow. DO NOT ADD ONE
      # without first landing project `references` (the real fix): restoring build-info
      # into a fresh checkout is what turns this job from "catches a cross-package type
      # break" into "silently reports it green". Turbo's `outputs` is not a substitute —
      # MEASURED, turbo does not clean declared outputs before a cache-miss run, so a
      # stale `*.tsbuildinfo` survives and `tsc -b` skips exactly as before.
      #
      # `--force` does NOT reach the `build` task, which skips for the same reason:
      # MEASURED, `pnpm build` exits 0 on a tree that does not compile and never
      # touches apps/api/dist. Turbo is not what saves us there — it ran the task as a
      # cache MISS and `tsc -b` itself decided there was nothing to do. What keeps that
      # harmless today is narrower and will not hold forever: apps/api's emitted JS
      # inlines nothing from contracts, and no package re-exports a workspace
      # dependency's types in its own `.d.ts`. The day packages/database re-exports a
      # contracts type — it already declares the dependency — apps/api's
      # `typecheck --force` will be checking against a stale
      # packages/database/dist/*.d.ts, which is this whole problem reopening one level
      # upstream, where `--force` cannot see it.
      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      # NOTE: this step runs after "Unit tests", and packages/contracts' test:unit
      # (vitest run --coverage) writes an istanbul/v8 HTML coverage report to
      # packages/contracts/coverage/*.js. Those generated support files (sorter.js,
      # block-navigation.js, prettify.js) start with an unjustified `/* eslint-disable */`.
      # Left unexcluded, this step fails on every run, including a clean tree — the
      # --exclude-dir flags below are load-bearing, not decoration. dist/ and
      # node_modules/ are excluded for the same reason (generated/vendored code, not
      # something this check should be reviewing) even though nothing in them currently
      # trips it.
      #
      # `.next` is the same story and is NOT hypothetical: the "Build" step above
      # runs `next build`, and MEASURED on next@16.3.0 the emitted Turbopack
      # bundles under apps/web/.next carry 53 unjustified `eslint-disable` and
      # `@ts-expect-error` lines from Next's own sources, plus 4 `@ts-ignore` for
      # the step below. Without this exclusion both suppression gates fail on a
      # clean tree from the moment apps/web exists.
      #
      # Two details in the pipeline below are deliberate:
      #
      #   - The pattern is `eslint-disable`, not `eslint-disable[^\n]*`. Inside an
      #     ERE bracket expression `\n` is the two characters backslash and `n`,
      #     not a newline, and the `*` allows zero of them — so the old suffix
      #     matched the same set of lines and only read as if it did something.
      #   - `*.mjs` is in the include list. It was not, and `apps/web/postcss.config.mjs`
      #     is the first `.mjs` file under `apps/` — the extension was uncovered by
      #     both gates from the moment it appeared. Clean today; the point is that
      #     a suppression added to it tomorrow would not have been seen. The
      #     `.cjs` extension is deliberately still absent: nothing in this
      #     workspace uses it, and an include pattern that matches nothing is a
      #     line nobody can tell is working.
      #   - The justification test runs against the LINE CONTENT only. `grep -rn`
      #     emits `path:lineno:content`, and a bare `grep -v -- '--'` on that
      #     drops any line whose PATH contains `--`, so a genuinely unjustified
      #     suppression under a directory named e.g. `foo--bar` would escape the
      #     gate silently. awk strips the `path:lineno:` prefix before testing and
      #     prints the original line, so the report still names the file.
      - name: Reject unjustified suppressions
        run: |
          if grep -rnE '(eslint-disable|@ts-expect-error)' \
               --include='*.ts' --include='*.tsx' --include='*.js' --include='*.mjs' \
               --exclude-dir=node_modules --exclude-dir=coverage --exclude-dir=dist \
               --exclude-dir=.next \
               packages apps 2>/dev/null \
             | awk '{ content = $0; sub(/^[^:]*:[0-9]+:/, "", content); if (content !~ /--/) print }' \
             | grep -q .; then
            echo "::error::Every eslint-disable / @ts-expect-error needs a '-- <justification>'"
            grep -rnE '(eslint-disable|@ts-expect-error)' \
               --include='*.ts' --include='*.tsx' --include='*.js' --include='*.mjs' \
               --exclude-dir=node_modules --exclude-dir=coverage --exclude-dir=dist \
               --exclude-dir=.next \
               packages apps 2>/dev/null \
             | awk '{ content = $0; sub(/^[^:]*:[0-9]+:/, "", content); if (content !~ /--/) print }'
            exit 1
          fi

      # NOTE: this must not be a bare `if grep ...; then` — with `apps/` not existing yet,
      # grep's own exit code is not a reliable signal of "no match" (a path-open error can
      # take precedence over a real match found elsewhere in the same invocation, which
      # makes the `if` false and silently passes a real @ts-ignore). Piping through
      # `grep -q .` makes the `if` depend on whether any content survived — i.e. on the
      # match itself — not on grep's own exit status. Same reasoning as the step above.
      - name: Reject @ts-ignore
        run: |
          if grep -rn '@ts-ignore' --include='*.ts' --include='*.tsx' --include='*.mjs' \
               --exclude-dir=node_modules --exclude-dir=coverage --exclude-dir=dist \
               --exclude-dir=.next \
               packages apps 2>/dev/null | grep -q .; then
            echo "::error::@ts-ignore is banned — use @ts-expect-error with a justification"
            exit 1
          fi

  # A separate job, not a step in `verify`, because everything it proves is
  # invisible to `verify`'s gates. `import type` on an injected provider, a
  # `Module.forRoot()` in AppModule, an RLS policy that does not isolate a
  # tenant, a probe that answers 200 while its dependency is down, a stack
  # trace escaping the exception filter: `format:check`, `lint`, `typecheck`
  # and `test:unit` are all green for every one of them.
  integration:
    runs-on: ubuntu-latest
    # No `env:` block. `DATABASE_ADMIN_URL` and both `NEXT_PUBLIC_` keys are
    # inherited from the workflow-level block at the top of this file, where the
    # measurements behind each of them live — including the one specific to this
    # job: `turbo run test:integration` schedules `@metrika/web#build`, so an
    # absent `NEXT_PUBLIC_*` fails this job on the web build before it ever
    # reaches a container, not only on the `pnpm build` step below.
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # See the cache warning at the top of this file before adding `.turbo`
      # caching to speed this up.
      - name: Build
        run: pnpm build

      # No `docker compose up` here: Testcontainers starts its own Postgres per
      # run, which is the point of it — the suite must not depend on a stack a
      # workflow file happened to bring up. ubuntu-latest ships a running
      # Docker daemon, so packages/testing's preflight passes.
      - name: Integration tests
        run: pnpm test:integration

  # A separate job for the same reason `integration` is one: everything it proves
  # is invisible to `verify`. `next-intl` resolving a catalogue, the stylesheet
  # actually loading rather than merely being referenced, the skip link being the
  # first focusable node, and `clientEnv` reaching the rendered document are all
  # properties of a page in a real browser — `format:check`, `lint`, `typecheck`
  # and `test:unit` are green for every one of them. Until this job existed the
  # suite ran nowhere but a developer's machine, which is a gate with a half-life.
  #
  # Not a step in `verify`, and not a root `pnpm test:e2e`, because it downloads a
  # browser. `pnpm verify` is what a developer runs before every push; a chromium
  # download does not belong in it. See `docs/LOCAL_DEVELOPMENT.md` §5.
  web:
    runs-on: ubuntu-latest
    # No `env:` block — inherited from the workflow-level one, same as
    # `integration` and `openapi`. For THIS job the placement is the whole point:
    # `src/app/layout.tsx` imports `clientEnv`, which parses at module scope, so
    # both `NEXT_PUBLIC_` keys are resolved by the `Build` step below. Setting
    # them on the `E2E` step instead — which is where a draft of this job put
    # them — kills the job one step earlier with "Failed to collect page data
    # for" a route and a ZodError, in a job whose subject is Playwright.
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Load-bearing, not a warm-up for the build Playwright runs for itself.
      # `webServer.command` in playwright.config.ts is apps/web's OWN `pnpm
      # build` — a bare `next build` — which builds that package and nothing
      # else, while `src/lib/formatting/money.ts` imports the VALUE `toBigInt`
      # from `@metrika/contracts`, whose `exports` map points at `dist/`.
      # MEASURED from a clean clone with this step skipped: `test:e2e` dies in
      # `webServer.command` before a browser is ever launched — `next build`
      # compiles, then fails its TypeScript phase with
      # `src/lib/formatting/money.ts(1,38): error TS2307: Cannot find module
      # '@metrika/contracts'`, and Playwright reports only "Process from
      # config.webServer was not able to start". This step is the topological
      # turbo run that produces that `dist/`.
      #
      # See the cache warning at the top of this file before adding `.turbo`
      # caching to speed this up.
      - name: Build
        run: pnpm build

      # Chromium only: playwright.config.ts declares no `projects`, so the suite
      # runs on the default chromium project and firefox/webkit would be two more
      # downloads nothing executes. `--with-deps` adds the system libraries
      # chromium needs on ubuntu-latest, which the browser binary alone does not
      # bring.
      - name: Install Playwright browsers
        run: pnpm --filter @metrika/web exec playwright install --with-deps chromium

      # No "start the server" step and nothing to poll for readiness: Playwright's
      # `webServer` builds and starts the app itself and waits on
      # http://127.0.0.1:3000. `CI` is set by GitHub Actions, which is what turns
      # `reuseExistingServer` off (so this can never grade an already-running
      # build) and `forbidOnly` on (so a stray `test.only` fails rather than
      # silently reducing the suite to one case).
      - name: E2E
        run: pnpm --filter @metrika/web test:e2e

  openapi:
    runs-on: ubuntu-latest
    # No `env:` block — inherited from the workflow-level one, same as
    # `integration`. The step-level `env:` further down is a different thing and
    # deliberately stays there: `DATABASE_URL` and `HEALTH_DEEP_TOKEN` are needed
    # by exactly one step, and scoping them to it is what says so.
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # See the cache warning at the top of this file before adding `.turbo`
      # caching to speed this up. `openapi:emit` runs `dist/scripts/
      # emit-openapi.js`, so this step is what produces the thing the next two
      # steps read — it is not an optimisation.
      - name: Build
        run: pnpm build

      # There is no `services: postgres:` block and no Testcontainer here, on
      # purpose. `emit-openapi.ts` does not call `app.init()`, so no lifecycle
      # hook fires and `PrismaService.$connect()` is never reached — emitting a
      # document is a static operation on the module graph. DATABASE_URL still
      # has to be present and well-formed, because ConfigModule validates the
      # environment while the graph is built; it does not have to be reachable.
      # The values are supplied here rather than through a `.env` file because
      # `openapi:emit` deliberately carries no `--env-file`.
      - name: Regenerate the OpenAPI document
        env:
          DATABASE_URL: postgresql://metrika_app:metrika_app@127.0.0.1:5432/metrika_dev?schema=public
          HEALTH_DEEP_TOKEN: ci-health-deep-token-value
        run: pnpm --filter @metrika/api openapi:emit

      # The document is committed, so a route or schema change that nobody
      # regenerated shows up as a diff here rather than as a client that no
      # longer matches the server.
      - name: Fail if the committed document is stale
        run: git diff --exit-code -- apps/api/openapi/openapi.json
